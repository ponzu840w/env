#!/usr/sbin/nft -f
# /etc/nftables.conf
# iris のホストファイアウォール
#  - 受け付けるのは Tailscale 経由の通信と、LAN からの SSH だけ
#  - tailscaled が自分で作るルール（iptables-nft）を消さないよう、flush ruleset はせず自分のテーブルだけ作り直す

table inet iris
delete table inet iris

table inet iris {
	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# ICMP（IPv6 は近隣探索やルーター広告に必須）
		meta l4proto { icmp, ipv6-icmp } accept

		# Tailscale
		iifname "tailscale0" accept
		udp dport 41641 accept

		# DHCP クライアント（v4 / v6）
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept

		# mDNS（iris.local）
		ip daddr 224.0.0.251 udp dport 5353 accept
		ip6 daddr ff02::fb udp dport 5353 accept

		# LAN からの SSH（Tailscale が落ちているときの入口）
		ip saddr 192.168.0.0/24 tcp dport 22 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}
